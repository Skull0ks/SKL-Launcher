<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8847ff"/>
      <stop offset="50%" style="stop-color:#d32ce6"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="10" y="38" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="url(#logoGrad)" filter="url(#glow)" letter-spacing="2">UPGRADER</text>
  <rect x="5" y="44" width="190" height="2" rx="1" fill="url(#logoGrad)" opacity="0.6"/>
</svg>
